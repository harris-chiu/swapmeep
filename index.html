:root{

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
aside{background:var(--side);color:#cbd5e1;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:4px 8px 16px}
.brand .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2f6fed,#1f8a5b);display:grid;place-items:center;font-size:14px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#cbd5e1;background:none;border:0;text-align:left;width:100%}
.nav:hover{background:var(--side2)}
.nav.on{background:#273244;color:#fff}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:#334155;color:#e2e8f0;border-radius:10px;padding:1px 7px}
.nav .badge.hot{background:var(--warn);color:#fff}
.side-sep{border-top:1px solid #263041;margin:10px 4px}
.who{margin-top:auto;padding:10px;background:var(--side2);border-radius:10px;font-size:12px}
.who select{width:100%;margin-top:6px;background:#0f141b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0}
.top .sub{color:var(--ink2);font-size:13px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:#cbd5e1}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:500;margin-top:2px}
.kpi .s{font-size:11px;color:var(--ink3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px}
.tab{background:none;border:0;padding:12px 12px 10px;color:var(--ink2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-family:var(--mono);font-size:11px;background:#f1f5f9;border-radius:9px;padding:0 6px;color:var(--ink2)}
.filters{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px;background:#fff}
.filters input{min-width:220px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid #f1f2f4;vertical-align:middle}
tr.click:hover td{background:#f8fafc;cursor:pointer}
.num{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.dim{color:var(--ink3)}
.game{display:flex;align-items:center;gap:10px;min-width:0}
.cov.img{position:relative;overflow:hidden;background:#e5e7eb!important}.cov.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}.cov.img span{position:relative}
.cov{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;flex:none;letter-spacing:.02em}
.gname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.gsub{font-size:12px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:20px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap;background:#fff}
.chip.pledged{color:var(--pledged)}.chip.pm{color:var(--pm)}.chip.ship{color:var(--ship)}.chip.owned{color:var(--owned)}.chip.listed{color:var(--listed)}.chip.sold{color:var(--sold)}
.chip.plain{color:var(--ink2);border-color:var(--line)}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chip.sample{color:#7a5d00;background:#fff6d6;border-color:transparent;font-size:11px}
.chip.real{color:#0f6b45;background:#e3f5ec;border-color:transparent;font-size:11px}
.prog{display:flex;gap:3px}
.prog i{width:16px;height:5px;border-radius:3px;background:#e5e7eb}
.prog i.f{background:var(--ink)}
.plat{font-size:12px;color:var(--ink2)}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.drawer-bg{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:#fff;z-index:21;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.drawer.open{transform:none}.drawer-bg.open{display:block}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header .cov{width:48px;height:48px;font-size:15px;border-radius:9px}
.drawer .body{padding:16px 20px;overflow:auto;flex:1}
.drawer h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin:18px 0 8px}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 14px 16px}
.tl li::before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink3)}
.tl li.real::before{border-color:var(--accent)}
.tl .d{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.tl .src{font-size:12px;color:var(--ink3)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);margin-bottom:10px}
.field input,.field select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--ink2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sync-row td{background:#fff}
.sync-row.approved td{background:#f0faf5}
.sync-row.skipped td{opacity:.45}
.arrow{font-family:var(--mono);color:var(--ink3);padding:0 6px}
.strike{text-decoration:line-through;color:var(--ink3)}
.section-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}

.rv.hi{border-color:#86efac;background:#f0fdf4}.rv.lo{border-color:#fecaca;background:#fef2f2}

.vplay{width:44px;height:30px;border-radius:6px;background:#ff0033;display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
.vplay.none{background:#e5e7eb;color:var(--ink3)}
.score-big{font-family:var(--mono);font-size:18px;font-weight:500;min-width:44px;text-align:right}
.rrow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}

.toggle.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}
  .brand{padding:4px 8px}
  .nav{width:auto}.side-sep,.who{display:none}
  main{padding:14px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
  .hide-m{display:none}
  .gname{max-width:180px}
}
</style>

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
function fmt(d){if(!d||d==='—')return'—';const [y,m,dd]=d.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]+' '+(+dd)+(y!=='2026'?', '+y:'')}
function hue(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h}
function cov(t){const w=t.replace(/^(The|A) /,'').split(/[\s:–-]+/).filter(Boolean);const ini=(w[0]?.[0]||'')+(w[1]?.[0]||'');const k=THUMB[t]?t:(typeof ALIAS!=='undefined'&&THUMB[ALIAS[t]])?ALIAS[t]:null;const tile=`<div class="cov" style="background:hsl(${hue(t)} 45% 42%)">${esc(ini.toUpperCase())}</div>`;return k?`<div class="cov img" style="background:hsl(${hue(t)} 45% 42%)"><img src="${BGGIMG+THUMB[k]}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"><span>${esc(ini.toUpperCase())}</span></div>`:tile}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const ST={pledged:['○','Pledged','pledged'],pm:['◐','PM locked','pm'],ship:['▸','Shipping','ship'],owned:['●','Owned','owned'],listed:['◆','Listed','listed'],sold:['✓','Sold','sold']};
const chip=s=>`<span class="chip ${ST[s][2]}">${ST[s][0]} ${ST[s][1]}</span>`;
const prog=s=>{const n={pledged:1,pm:2,ship:3,owned:4}[s]||0;return `<span class="prog">${[1,2,3,4].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')}</span>`};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
// SAMPLE market price: deterministic pseudo value from title (clearly labelled sample)
function samplePrice(t){const h=hue(t+'p');return 25+Math.round((h/360)*110)}
function sampleTrend(t){const h=hue(t+'t');return Math.round(((h%41)-20)/2)}
const owns=(u,t)=>copies.some(c=>c.owner===u&&c.title===t&&['owned','listed'].includes(c.state));


/* ===== reviewer helpers ===== */
const DATA_TITLES=new Set([...Object.keys(VIDEOS),...Object.values(RATINGS).flatMap(o=>Object.keys(o))]);
function rkey(t){return ALIAS[t]||t}
function revFor(c,user){
  const t=rkey(c.title),out=[];
  for(const rid of FOLLOWS[user]||[]){const R=REVIEWERS[rid];if(!R||(R.kind==='friend'&&R.user===user))continue;
    let score=null,video=null;
    if(rid==='bgg')score=c.rating||null;
    else if(R.kind==='friend')score=RATINGS[R.user]?.[t]??null;
    else score=RATINGS[rid]?.[t]??null;
    if(R.channel&&VIDEOS[t]&&VIDEOS[t][R.channel])video=VIDEOS[t][R.channel];
    out.push({rid,R,score,video});}
  return out;
}
function avgFollowed(c,user){const xs=revFor(c,user).filter(x=>x.rid!=='bgg'&&x.score!=null).map(x=>x.score);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null}
const ini=n=>n.split(/[\s&]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
function avImg(R){const ch=R.channel&&CHAN[R.channel];return ch?`<img src="${ch[0]}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
function revCell(c,user){
  const rs=revFor(c,user).filter(x=>x.score!=null||x.video);
  if(!rs.length)return '<span class="dim" style="font-size:12px">—</span>';
  return `<div class="revs">${rs.slice(0,6).map(x=>{const cls=x.score==null?'vid':x.score>=8.5?'hi':x.score<6?'lo':'';const label=x.score!=null?(+x.score).toFixed(x.score%1?1:0):'▶';const tip=`${x.R.name}${x.score!=null?': '+x.score:''}${x.video?' · video: '+x.video[1]:''}`;
    return x.video?`<a class="rv ${cls}" href="https://www.youtube.com/watch?v=${x.video[0]}" target="_blank" rel="noopener" title="${esc(tip)}"><i style="background:${x.R.color}">${avImg(x.R)}${ini(x.R.name)}</i>${label}${x.score!=null?' ▶':''}</a>`:`<span class="rv ${cls}" title="${esc(tip)}"><i style="background:${x.R.color}">${avImg(x.R)}${ini(x.R.name)}</i>${label}</span>`}).join('')}</div>`;
}
function revSection(c,user){
  const t=rkey(c.title);const rs=revFor(c,user);
  const others=VIDEOS[t]?Object.entries(VIDEOS[t]).filter(([ch])=>!rs.some(x=>x.R.channel===ch)):[];
  const vc=(ch,v,score,who)=>`<a class="vcard" href="https://www.youtube.com/watch?v=${v[0]}" target="_blank" rel="noopener"><div class="vthumb"><img src="https://i.ytimg.com/vi/${v[0]}/mqdefault.jpg" alt="" referrerpolicy="no-referrer" onerror="this.remove()"><b>▶</b></div><div style="flex:1;min-width:0"><div style="font-weight:500;font-size:13px">${esc(v[1])}</div><div class="gsub">${esc(ch)} · ${esc(v[2])} · ${esc(v[3])} views</div></div>${score!=null?`<div class="score-big">${score}</div>`:''}</a>`;
  let h=`<h3>Your reviewers ${t!==c.title?`<span class="dim" style="text-transform:none;letter-spacing:0">(base game: ${esc(t)})</span>`:''}</h3>`;
  h+=rs.map(x=>{if(x.video)return vc(x.R.name+(x.R.channel&&x.R.channel!==x.R.name?' · '+x.R.channel:''),x.video,x.score);
    return `<div class="vcard"><div class="vplay none">${x.rid==='bgg'?'★':'—'}</div><div style="flex:1"><div style="font-weight:500;font-size:13px">${esc(x.R.name)}</div><div class="gsub">${x.score!=null?(x.rid==='bgg'?'BGG average rating':'Rating on BGG'):'No rating or video found yet'}</div></div>${x.score!=null?`<div class="score-big">${x.score}</div>`:''}</div>`}).join('');
  if(others.length)h+=`<h3>More videos on YouTube</h3>`+others.map(([ch,v])=>vc(ch,v,null)).join('');
  h+=`<a class="btn sm" style="display:inline-block;text-decoration:none;margin-top:4px" href="https://www.youtube.com/results?search_query=${encodeURIComponent(t+' board game review')}" target="_blank" rel="noopener">Search YouTube for more ↗</a>`;
  return h;
}
function vReviewers(){
  const mine=copies.filter(c=>c.owner===me);
  const cov=rid=>mine.filter(c=>revFor(c,me).some(x=>x.rid===rid&&(x.score!=null||x.video))).length;

function matches(){
  // computed from data, all real for Harris/Marlon
  const out=[];
  const users=['harris','marlon','jules'];
  for(const a of users)for(const b of users){if(a===b)continue;
    copies.filter(c=>c.owner===a&&c.state==='listed').forEach(c=>{if(WANTS[b].includes(c.title))out.push({from:a,to:b,title:c.title,type:'trade',why:`${USERS[a].name} has it for trade · ${USERS[b].name} wants it`})});
    copies.filter(c=>c.owner===a&&c.state==='owned').forEach(c=>{if(WANTS[b].includes(c.title)&&!out.some(o=>o.title===c.title&&o.to===b))out.push({from:a,to:b,title:c.title,type:'own',why:`${USERS[a].name} owns it · on ${USERS[b].name}'s want list`})});
  }
  // special: TMB Marlon trade vs Harris BGG preorder flag; Eternal Decks
  out.unshift({from:'marlon',to:'harris',title:'Too Many Bones',type:'trade',why:'Marlon has it for trade (+4 expansions, 15 plays) · your BGG still says Preordered'});
  out.push({from:'harris',to:'marlon',title:'Eternal Decks',type:'pre',why:'Your BGG says Preordered · on Marlon\'s wishlist. Co-pledge, or offer him your copy'});
  return out.filter(m=>!(m.from==='jules'||m.to==='jules')||true);
}

  const ev=[...c.events];
  if(c.title==="Andromeda's Edge: Genesis"&&!ev.some(e=>e.sample))ev.push({d:'2026-02-26',t:'Pledge manager — pledge changed',src:'Gmail · Gamefound',real:true});
  const evs=ev.sort((a,b)=>b.d.localeCompare(a.d));
  const isIn=['pledged','pm','ship'].includes(c.state);
  $('#drawer').innerHTML=`<header>${cov(c.title)}<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:17px">${esc(c.title)}</div><div class="gsub">${USERS[c.owner].name}${c.copyOf?` · copy ${c.copyN} of ${c.copyOf}`:''}${c.year?' · '+c.year:''}</div><div style="margin-top:6px">${chip(c.state)} ${isIn?prog(c.state):''}</div></div><button class="btn ghost" id="dx">✕</button></header>
  <div class="body">
   <div class="kv"><div>Platform / channel</div><div>${esc(c.platform||c.channel||'—')}</div><div>BGG rating</div><div class="num" style="text-align:left">${c.rating?c.rating.toFixed(3):'—'}</div><div>Plays (BGG)</div><div>${c.plays||'—'}</div><div>Paid</div><div class="dim">— not in data yet</div><div>Market*</div><div class="dim">$${samplePrice(c.title)} (sample)</div><div>BGG status</div><div>${isIn&&c.owner==='harris'?'Not in collection → <b>Preordered</b> queued for review':c.state==='sold'?'Not in your BGG collection':ST[c.state][1]}</div></div>
   ${revSection(c,me)}
   <h3>Timeline</h3>
   ${evs.length?`<ul class="tl">${evs.map(e=>`<li class="${e.real?'real':''}"><div class="d">${fmt(e.d)}</div><div>${esc(e.t)}</div><div class="src">${esc(e.src)}${e.real?'':' · manual'}</div></li>`).join('')}</ul>`:'<div class="dim">No events yet. This copy came from the BGG import.</div>'}
   ${c.state==='sold'&&c.price?`<h3>Sale</h3><div class="kv"><div>Price</div><div>$${c.price}</div></div>`:''}
   <div id="dform"></div>
  </div>
  <div class="actions">
   ${isIn?`<button class="btn pri" data-act="deliver">Mark delivered</button>`:''}
   ${c.state==='owned'?`<button class="btn pri" data-act="list">List for sale</button>`:''}
   ${c.state==='listed'?`<button class="btn pri" data-act="sell">Mark sold…</button><button class="btn" data-act="unlist">Unlist</button>`:''}
   ${c.state==='owned'?`<button class="btn" data-act="sell">Mark sold…</button>`:''}
   <span class="dim" style="font-size:12px;align-self:center;margin-left:auto">Each change queues a BGG update for review</span>
  </div>`;
  $('#drawer').classList.add('open');$('#dbg').classList.add('open');
  $('#dx').onclick=closeD;
  $('#drawer').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(c,b.dataset.act));
}
function closeD(){$('#drawer').classList.remove('open');$('#dbg').classList.remove('open')}
function queue(c,from,to,why){syncQ=syncQ.filter(s=>s.copy!==c.id);syncQ.unshift({id:'s'+c.id+Date.now(),copy:c.id,title:c.title,from,to,why,kind:'add',state:'pending'})}
function act(c,a){
  if(a==='deliver'){c.events.push({d:TODAY,t:'Marked delivered',src:'You'});c.state='owned';if(c.owner==='harris')queue(c,'not in collection','Own','Marked delivered '+fmt(TODAY));toast('Moved to Owned · BGG change queued');closeD();render();return}
  if(a==='list'){c.events.push({d:TODAY,t:'Listed for sale',src:'You'});c.state='listed';if(c.owner==='harris')queue(c,'Own','Own + For trade','Listed '+fmt(TODAY));toast('Listed · group notified of matching wants');closeD();render();return}
  if(a==='unlist'){c.state='owned';c.events.push({d:TODAY,t:'Unlisted',src:'You'});toast('Back in Owned');closeD();render();return}
  if(a==='sell'){
    const want=Object.keys(USERS).filter(u=>u!==c.owner&&WANTS[u].includes(c.title));
    $('#dform').innerHTML=`<h3>Mark sold</h3>${want.length?`<div class="att" style="background:#fff7ed;border-radius:8px;margin-bottom:10px"><div>⚠</div><div><div class="t">${want.map(u=>USERS[u].name).join(', ')} want${want.length>1?'':'s'} this</div><div class="m">Offer it to the group before selling elsewhere?</div></div></div>`:''}
    <div class="field">Channel<select id="ch"><option>eBay</option><option>BGG Marketplace</option><option>Facebook Marketplace</option><option>Friend (group)</option><option>Local</option></select></div>
    <div class="field">Sale price (USD)<input id="pr" type="number" min="0" placeholder="e.g. 45"></div>
    <button class="btn pri" id="dosell">Confirm sale</button>`;
    $('#dosell').onclick=()=>{c.state='sold';c.channel=$('#ch').value;c.price=+$('#pr').value||null;c.date=TODAY;c.events.push({d:TODAY,t:'Sold via '+c.channel+(c.price?' for $'+c.price:''),src:'You'});if(c.owner==='harris')queue(c,'Own','Prev. owned','Sold '+fmt(TODAY));toast('Moved to Sold · BGG change queued');closeD();render()};
  }
}

/* ===================== ROUTER / RENDER ===================== */
function render(){
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.route===route));
  $('#b-sync').textContent=syncQ.filter(s=>s.state==='pending').length;
  $('#b-att').textContent=attention.filter(a=>!a.done).length;
  const v={collection:vCollection,sync:vSync,attention:vAttention,market:vMarket,group:vGroup,shelf:vShelf,reviewers:vReviewers}[route]||vCollection;
  $('#main').innerHTML=v();bind();
}
function go(r){route=r;try{history.replaceState(null,'','#'+r)}catch(e){location.hash=r}render();window.scrollTo(0,0)}
function bind(){
  const M=$('#main');
  M.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  M.querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>{lane=b.dataset.lane;render()});
  const qi=$('#q');if(qi){qi.oninput=e=>{q=e.target.value.toLowerCase();const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
  const pl=$('#plat');if(pl)pl.onchange=e=>{plat=e.target.value;render()};
  const sb=$('#sortby');if(sb)sb.onchange=e=>{sortBy=e.target.value;render()};
  M.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>{const r=b.dataset.follow,f=FOLLOWS[me];const i=f.indexOf(r);if(i>=0)f.splice(i,1);else f.push(r);toast((i>=0?'Unfollowed ':'Following ')+REVIEWERS[r].name);render()});
  const ab=$('#addbgg');if(ab)ab.onclick=()=>{const u=$('#bggu').value.trim();if(!u)return;const hit=Object.entries(REVIEWERS).find(([k,v])=>(v.bggUser||'').toLowerCase()===u.toLowerCase());if(hit){if(!FOLLOWS[me].includes(hit[0]))FOLLOWS[me].push(hit[0]);toast('Following '+hit[1].name);render()}else toast('Prototype: would read '+u+'\'s public BGG ratings and add them as a column')};
  M.querySelectorAll('.rv,a.vcard').forEach(a=>a.addEventListener('click',e=>e.stopPropagation()));
  M.querySelectorAll('tr.click').forEach(r=>r.onclick=e=>{if(e.target.closest('button'))return;openCopy(r.dataset.c)});
  M.querySelectorAll('[data-list]').forEach(b=>b.onclick=()=>act(copies.find(c=>c.id===b.dataset.list),'list'));
  M.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{openCopy(b.dataset.sell);act(copies.find(c=>c.id===b.dataset.sell),'sell')});
  M.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{syncQ.find(s=>s.id===b.dataset.ap).state='approved';render()});
  M.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{syncQ.find(s=>s.id===b.dataset.sk).state='skipped';render()});
  M.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{syncQ.find(s=>s.id===b.dataset.undo).state='pending';render()});
  const apall=$('#apall');if(apall)apall.onclick=()=>{syncQ.forEach(s=>{if(s.state==='pending'&&s.kind!=='optional')s.state='approved'});render()};
  const push=$('#push');if(push)push.onclick=()=>{const ap=syncQ.filter(s=>s.state==='approved');pushHistory.unshift({n:ap.length,titles:ap.map(s=>s.title+' → '+s.to).join(' · ')});syncQ=syncQ.filter(s=>s.state!=='approved');toast(ap.length+' changes pushed (simulated, nothing sent to BGG)');render()};
  M.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{review.find(r=>r.id===b.dataset.rv).state=b.dataset.o;render()});
  M.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{const a=attention.find(x=>x.id===b.dataset.at);if(b.dataset.o==='Go to sync'){go('sync');return}a.done=b.dataset.o;if(a.id==='a7'&&b.dataset.o==='Mark both delivered'){copies.filter(c=>['Agricola Special Edition','Distilled: Cocktails'].includes(c.title)).forEach(c=>act(c,'deliver'))}if(a.id==='a1'&&b.dataset.o==='Open BackerKit email'){a.done=false;toast('Would open the BackerKit email in Gmail');return}render()});
  M.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{attention.find(x=>x.id===b.dataset.reopen).done=false;render()});
  M.querySelectorAll('[data-friend]').forEach(b=>b.onclick=()=>{if(b.dataset.friend===me){go('collection');return}friend=b.dataset.friend;go('shelf')});
  const fr=$('#fr');if(fr)fr.onchange=e=>{friend=e.target.value;render()};
  M.querySelectorAll('[data-ping]').forEach(b=>b.onclick=()=>toast('Would message the group about '+b.dataset.ping+' (prototype)'));
  const inv=$('#invite');if(inv)inv.onclick=()=>toast('Invite flow: share link → sign in → connect Claude to the SwapMeep MCP → enter BGG username');
}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.route));
$('#dbg').onclick=closeD;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
const sel=$('#asUser');sel.innerHTML=Object.entries(USERS).map(([k2,u])=>`<option value="${k2}">${u.name}${u.real?'':' (sample)'}</option>`).join('');
sel.onchange=e=>{me=e.target.value;friend=me==='marlon'?'harris':'marlon';lane=me==='harris'?'incoming':'owned';render()};
const h=(location.hash||'').slice(1);if(['collection','sync','attention','market','group','shelf','reviewers'].includes(h))route=h;
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(r&&r!==route&&['collection','sync','attention','market','group','shelf','reviewers'].includes(r)){route=r;render()}});
render();
</script>
</body>
</html>
